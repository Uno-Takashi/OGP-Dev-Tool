name: label

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Create size labels if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create XS --color 3cbf00 --description "Extra small change (< 10 lines)" --repo ${{ github.repository }} 2>/dev/null || true
          gh label create S  --color 5d9801 --description "Small change (10-49 lines)"      --repo ${{ github.repository }} 2>/dev/null || true
          gh label create M  --color e1b01b --description "Medium change (50-199 lines)"    --repo ${{ github.repository }} 2>/dev/null || true
          gh label create L  --color eb6420 --description "Large change (200-499 lines)"    --repo ${{ github.repository }} 2>/dev/null || true
          gh label create XL --color e11d48 --description "Extra large change (500+ lines)" --repo ${{ github.repository }} 2>/dev/null || true

      - name: Apply size label
        uses: srvaroa/labeler@v1
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
