name: release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      release_note:
        description: "Release notes (optional)"
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Bump version
        id: version
        run: |
          NEW_VERSION=$(npm version "${{ github.event.inputs.bump_type }}" --no-git-tag-version)
          VERSION_NUM=${NEW_VERSION#v}
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          export VERSION_NUM
          node << 'EOF'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('public/manifest.json', 'utf8'));
          m.version = process.env.VERSION_NUM;
          fs.writeFileSync('public/manifest.json', JSON.stringify(m, null, 2) + '\n');
          EOF

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json public/manifest.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }} [skip ci]"
          git push origin HEAD:main

      - name: Build
        run: npm run build

      - name: Package extension
        run: zip -r ogp-dev-tool_${{ steps.version.outputs.new_version }}.zip dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          name: ${{ steps.version.outputs.new_version }}
          body: ${{ github.event.inputs.release_note }}
          files: ogp-dev-tool_${{ steps.version.outputs.new_version }}.zip
          generate_release_notes: true
          target_commitish: main

      - name: Upload to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v6.0.0
        with:
          file-path: ogp-dev-tool_${{ steps.version.outputs.new_version }}.zip
          extension-id: ${{ secrets.EXTENSION_ID }}
          client-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          refresh-token: ${{ secrets.REFRESH_TOKEN }}
